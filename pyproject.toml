[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wraith"
version = "0.1.0"
description = "Стенд проверки LLM-приложения на инъекции, утечки и злоупотребление инструментами, с привязкой к OWASP LLM Top 10 и MITRE ATLAS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "misxnthropy" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
wraith = "wraith.__main__:main"

[tool.setuptools]
packages = ["wraith"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 300
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
